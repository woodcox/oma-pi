# Herdr configuration for Oma-Pi
# Place this file at ~/.config/herdr/config.toml

# Skip first-run onboarding; Oma-Pi installs a working config.
onboarding = false

[theme]
# Follow the host terminal's ANSI palette, like the old tmux setup.
name = "terminal"

[keys]
# tmux used Ctrl+Space as its prefix and Ctrl+B as a second prefix.
prefix = ["ctrl+space", "ctrl+b"]

# Config and help
reload_config = "prefix+q"
detach = "prefix+d"

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"

focus_pane_left = "ctrl+alt+left"
focus_pane_right = "ctrl+alt+right"
focus_pane_up = "ctrl+alt+up"
focus_pane_down = "ctrl+alt+down"

resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"

# Tabs (tmux windows)
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"
switch_tab = "alt+1..9"

# Workspaces (tmux sessions)
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
mouse_capture = true
pane_borders = "auto"
tab_bar_position = "top"
accent = "blue"
window_title = "{hostname}: {workspace}"
tab_bar_right = [{ type = "hostname" }]

[ui.toast]
delivery = "herdr"

[terminal]
# Herdr keeps TERM=xterm-256color and COLORTERM=truecolor for panes.
kitty_graphics = true

[advanced]
# Roughly the old tmux history-limit of 50000 lines.
scrollback_limit_bytes = 50000000
