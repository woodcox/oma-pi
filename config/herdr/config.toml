# Herdr configuration for Oma-Pi
# Place this file at ~/.config/herdr/config.toml

# Skip first-run onboarding; Oma-Pi installs a working config.
onboarding = false

[theme]
name = "catppuccin"

# Keybindings intentionally use Herdr's defaults. The Oma-Pi layout helpers
# (hdl, hds, hdlm, hsl) are shell functions, not Herdr keybindings; run them
# from a pane and see `omapi-help` for their usage.

[ui]
mouse_capture = true
pane_borders = "auto"
tab_bar_position = "top"
window_title = "{hostname}: {workspace}"
tab_bar_right = [{ type = "hostname" }]

[ui.toast]
delivery = "herdr"

[terminal]
# Herdr keeps TERM=xterm-256color and COLORTERM=truecolor for panes.
kitty_graphics = true

[advanced]
# Roughly the old tmux history-limit of 50000 lines.
scrollback_limit_bytes = 50000000
